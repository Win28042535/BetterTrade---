<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Ranking — Better Trade 2026</title>
<!--
  Ranking display for the event's big screen — a fixed 1920×1080 stage scaled to fit any window.
  Design prototype: no real data. The counts are simulated from SAMPLE (see "simulated data" in the
  script) so the live-count and rank-swap animations can be previewed; a real source would feed
  render({counts}) instead.
  F → toggle fullscreen
-->
<style>
@font-face{font-family:'FC Minimal';src:url(assets/fc-minimal-100-500.ttf) format('truetype');font-weight:100 500;font-display:swap;}
@font-face{font-family:'FC Minimal';src:url(assets/fc-minimal-600-900.ttf) format('truetype');font-weight:600 900;font-display:swap;}
@font-face{font-family:'Baskervville';src:url(assets/baskervville-400-700.ttf) format('truetype');font-weight:400 700;font-display:swap;}
@font-face{font-family:'Taviraj';src:url(assets/taviraj-medium.ttf) format('truetype');font-weight:100 599;font-display:swap;}
@font-face{font-family:'Taviraj';src:url(assets/taviraj-bold.ttf) format('truetype');font-weight:600 900;font-display:swap;}

/* Tokens mirror dna-quiz-flow.html's :root — the screen sits next to the app at the booth, so it
   speaks the same "calm, but credible" language: paper ground, hairlines, serif display. Emphasis
   comes from light, not darkness: a spectrum glow behind #1, a spectrum rim on #2–4, plain tiles after. */
:root{
  --ink:#111318; --muted:#687078; --white:#fff;
  --base:#cfd6e2;
  --muted-base:#4b535c; /* --muted reads too faint on --base; used for text that sits directly on it */ /* the screen's blue-grey ground — a step darker than the app's paper so white tiles and the #1 card lift off it */
  --line:rgba(17,19,24,0.09); --line-strong:rgba(17,19,24,0.17);
  --cyan:#61e8ed; --violet:#9c91ff; --pink:#f178d8; --yellow:#f2ea83;
  --spectrum:linear-gradient(120deg,#61e8ed,#9c91ff,#f178d8,#f2ea83);
  --font:'FC Minimal','Taviraj',system-ui,'Segoe UI',sans-serif;
  --serif:'Baskervville','Bodoni MT',Georgia,serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--base);}
body{font-family:var(--font);color:var(--ink);}

.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  padding:44px 72px 44px;display:grid;grid-template-rows:auto 1fr;gap:32px;
  background:
    radial-gradient(900px 700px at 16% 62%, color-mix(in srgb,var(--violet) 14%,transparent), transparent 70%),
    radial-gradient(700px 500px at 60% 30%, color-mix(in srgb,var(--cyan) 8%,transparent), transparent 70%),
    var(--base);}

/* ── header ── */
.logo{position:absolute;top:28px;right:72px;height:34px;}
.hd{position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:22px 0 24px;}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:2px;background:var(--spectrum);} /* DNA rule */
.hd-kicker{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-base);font-weight:500;}
.hd-title{font-size:76px;font-weight:700;line-height:1.05;margin-top:8px;}
.total{display:flex;align-items:baseline;gap:16px;}
.total-n{font-family:var(--serif);font-weight:600;font-size:80px;line-height:.8;font-variant-numeric:tabular-nums;} /* = tile counts */
.total-l{font-size:32px;color:var(--muted-base);}

/* ── body ── */
.body{display:grid;grid-template-columns:560px 1fr;gap:40px;min-height:0;}

/* #1 hero — centred column; the glow behind the card is the screen's loudest element */
.hero{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:0;}
/* tight, saturated glow hugging the card — sits in .hero-wrap right behind it */
.hero-wrap{position:relative;margin-top:16px;}
/* five colour blobs centred on the card's own edges, so half of each spills out as a ~50px halo.
   Each drifts on its own path and period (14–22s, offset starts) so they never move in step and
   the colours keep re-mixing where they overlap; only transform/opacity animate (GPU-cheap). */
.hero-glow{position:absolute;inset:-50px;filter:blur(30px);}
.hero-glow i{position:absolute;left:calc(var(--x) - var(--rx));top:calc(var(--y) - var(--ry));width:calc(var(--rx) * 2);height:calc(var(--ry) * 2);
  background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 32%,transparent),transparent 75%);
  animation:var(--path) var(--d) ease-in-out var(--dl) infinite;will-change:transform,opacity;}
.hero-glow i:nth-child(1){--c:var(--cyan);  --x:10%;--y:26%;--rx:150px;--ry:260px;--path:driftA;--d:17s;--dl:-3s;}
.hero-glow i:nth-child(2){--c:var(--pink);  --x:72%;--y:8%; --rx:180px;--ry:150px;--path:driftB;--d:21s;--dl:-11s;}
.hero-glow i:nth-child(3){--c:var(--pink);  --x:90%;--y:52%;--rx:160px;--ry:280px;--path:driftC;--d:15s;--dl:-6s;}
.hero-glow i:nth-child(4){--c:var(--violet);--x:10%;--y:74%;--rx:170px;--ry:280px;--path:driftB;--d:19s;--dl:-14s;}
.hero-glow i:nth-child(5){--c:var(--yellow);--x:66%;--y:92%;--rx:220px;--ry:160px;--path:driftA;--d:22s;--dl:-8s;}
@keyframes driftA{
  0%,100%{transform:translate(0,0) scale(1);opacity:.85}
  33%{transform:translate(26px,-24px) scale(1.12);opacity:1}
  66%{transform:translate(-20px,22px) scale(.92);opacity:.7}}
@keyframes driftB{
  0%,100%{transform:translate(0,0) scale(1.05);opacity:.9}
  40%{transform:translate(-30px,18px) scale(.9);opacity:.7}
  75%{transform:translate(18px,30px) scale(1.15);opacity:1}}
@keyframes driftC{
  0%,100%{transform:translate(0,0) scale(.95);opacity:.75}
  30%{transform:translate(-22px,-30px) scale(1.1);opacity:1}
  70%{transform:translate(24px,16px) scale(1);opacity:.8}}
/* rank pill — shared by #1 and the tiles; UI font so the numeral doesn't echo the serif counts */
.pill{display:inline-flex;align-items:center;align-self:center;border-radius:48px;background:rgba(17,19,24,0.07);color:#3a4048;
  font-family:var(--font);font-weight:600;line-height:1;white-space:nowrap;}
/* white on the pale spectrum needs a soft dark shadow to stay legible */
.hero-rank{padding:12px 32px;font-size:32px;background:var(--spectrum);color:#fff;
  text-shadow:0 1px 2px rgba(17,19,24,0.45),0 0 6px rgba(17,19,24,0.25);}
/* lifted card: contact + mid + long drop shadows (plus the violet bloom), a white rim to cut it from
   the glow, and a slow 6px float — the drop shadows loosen and fade as it rises */
.hero-card{position:relative;height:524px;aspect-ratio:5/7;border-radius:28px;overflow:hidden;
  --sh-near:0 2px 4px rgba(17,19,24,0.16);
  --sh-bloom:0 30px 80px color-mix(in srgb,var(--violet) 32%,transparent);
  box-shadow:var(--sh-near),0 14px 28px rgba(17,19,24,0.16),0 44px 70px -12px rgba(17,19,24,0.27),var(--sh-bloom);
  animation:float 6s ease-in-out infinite;}
.hero-card::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,0.75);pointer-events:none;}
@keyframes float{
  50%{transform:translateY(-6px);
    box-shadow:var(--sh-near),0 18px 32px rgba(17,19,24,0.13),0 54px 80px -14px rgba(17,19,24,0.22),var(--sh-bloom);}}
.hero-card img{width:100%;height:100%;object-fit:cover;display:block;}
/* margin clears the glow's ~50px spill below the card */
.hero-n{margin-top:48px;font-family:var(--serif);font-weight:600;font-size:172px;line-height:.8;font-variant-numeric:tabular-nums;}
.hero-n small{font-family:var(--font);font-size:48px;color:var(--muted-base);margin-left:12px;}

/* live counts: a "+N" floats off the number each time it steps up */
.v{position:relative;display:inline-block;}
.plus{position:absolute;left:100%;top:-.05em;margin-left:6px;font-family:var(--font);font-weight:700;font-size:22px;line-height:1;
  color:#15803d;white-space:nowrap;pointer-events:none;animation:plus 1.4s var(--ease) forwards;}
.hero-n .plus{font-size:32px;margin-left:10px;}
@keyframes plus{from{opacity:0;transform:translateY(12px)}20%{opacity:1}to{opacity:0;transform:translateY(-30px)}}

/* #2–12 — 3 × 4 grid on a cloud panel; slot 12 stays empty */
/* the full-strength DNA spectrum (as on the #1 pill), so the near-opaque white tiles pop off it */
.grid{position:relative;border-radius:28px;padding:12px;min-height:0;
  background:linear-gradient(125deg,var(--cyan) 0%,var(--violet) 36%,var(--pink) 68%,var(--yellow) 100%);}
.tiles{position:relative;width:100%;height:100%;}
.tile{position:absolute;left:0;top:0;width:var(--w);height:var(--h);display:flex;gap:18px;align-items:center;padding:6px 16px 6px 6px;
  border-radius:20px;background:rgba(255,255,255,0.98);border:2px solid transparent;box-shadow:0 6px 18px rgba(17,19,24,0.14);
  transition:transform 1.2s var(--ease),scale .5s var(--ease),box-shadow .5s;will-change:transform;z-index:1;}
/* while overtaking, a rising tile lifts above the ones it passes */
.tile.rise{z-index:5;scale:1.05;box-shadow:0 18px 44px rgba(17,19,24,0.22);}
.tile.fall{z-index:0;}
.tile.hold-card .tile-card{visibility:hidden;} /* its card is mid-flight to/from the hero slot */
.delta{display:none;margin-left:8px;font-size:.9em;font-style:normal;}
.tile.up .delta,.tile.down .delta{display:inline;}
.tile.up .delta{color:#15803d;} .tile.up .delta::after{content:"▲";}
.tile.down .delta{color:var(--muted);} .tile.down .delta::after{content:"▼";}
.flyer{position:absolute;z-index:20;overflow:hidden;box-shadow:0 24px 60px rgba(17,19,24,0.3);pointer-events:none;}
.flyer img{width:100%;height:100%;object-fit:cover;display:block;}
.tile-card{flex:none;height:100%;aspect-ratio:5/7;border-radius:10px;overflow:hidden;box-shadow:0 4px 12px rgba(17,19,24,0.16);}
.tile-card img{width:100%;height:100%;object-fit:cover;display:block;}
.tile-info{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;}
.tile-rank{align-self:flex-start;margin-top:8px;padding:6px 14px;font-size:18px;}
.tile-th{font-size:26px;font-weight:700;line-height:1.15;margin-top:6px;}
.tile-en{font-family:var(--serif);font-size:20px;color:var(--muted);margin-top:2px;}
.tile-n{margin-top:auto;display:flex;align-items:baseline;font-family:var(--serif);font-weight:600;font-size:80px;line-height:.8;font-variant-numeric:tabular-nums;}
.tile-n small{font-family:var(--font);font-size:32px;color:var(--muted);margin-left:6px;}

.foot{position:absolute;right:72px;bottom:12px;font-size:18px;color:var(--muted-base);letter-spacing:.04em;}
.foot b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#15803d;margin-right:8px;vertical-align:middle;animation:pulse 2s infinite;}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.tile{transition:none}.foot b,.hero-glow i,.hero-card{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="logo" src="LOGO/LOGO-efin-Better Trade/LOGO-efin-Better Trade.png" alt="efin × Better Trade">
  <header class="hd">
    <div>
      <div class="hd-kicker">BetterTrade 2026 × New World New Playbook · Investor DNA</div>
      <h1 class="hd-title">ตัวตนนักลงทุน</h1>
    </div>
    <div class="total"><div class="total-l">ผู้ที่ค้นพบตัวตนทั้งหมด (คน)</div><div class="total-n" id="total">0</div></div>
  </header>

  <main class="body">
    <section class="hero">
      <div class="pill hero-rank">อันดับ 1</div>
      <div class="hero-wrap"><div class="hero-glow"><i></i><i></i><i></i><i></i><i></i></div><div class="hero-card" id="heroCard"><img id="heroImg" alt=""></div></div>
      <div class="hero-n"><span class="v" id="heroN">0</span><small>คน</small></div>
    </section>

    <section class="grid"><div class="tiles" id="tiles"></div></section>
  </main>
  <div class="foot"><b></b>ข้อมูลตัวอย่าง (จำลอง)</div>
</div>

<script>
const PERSONAS = {
  guardian:{en:'The Guardian',th:'นักลงทุนสายรักษาทุน'},
  harvester:{en:'The Harvester',th:'นักลงทุนสายเก็บเกี่ยว'},
  steadyhand:{en:'The Steady Hand',th:'นักลงทุนสายสม่ำเสมอ'},
  diamondhand:{en:'The Diamond Hand',th:'นักลงทุนสายถือยาว'},
  analyst:{en:'The Analyst',th:'นักลงทุนสายหาข้อมูล'},
  planner:{en:'The Planner',th:'นักลงทุนสายวางแผน'},
  explorer:{en:'The Explorer',th:'นักลงทุนสายสำรวจ'},
  sage:{en:'The Sage',th:'นักลงทุนสายสมดุลชีวิต'},
  maverick:{en:'The Maverick',th:'นักลงทุนสายบุกเบิก'},
  waverider:{en:'The Wave Rider',th:'นักลงทุนสายโต้คลื่น'},
  contrarian:{en:'The Contrarian',th:'นักลงทุนสายสวนกระแส'},
  collector:{en:'The Collector',th:'นักลงทุนสายสะสม'}
};
// starting counts for the simulation (the staff dashboard's figures at the time of the mock-up)
const SAMPLE = {steadyhand:102,diamondhand:73,analyst:54,harvester:47,explorer:43,contrarian:35,
  waverider:29,planner:25,sage:15,maverick:11,guardian:8,collector:2};
const COLS = 3, ROWS = 4, GAP = 12;

/* ── fit the 1920×1080 stage into any window (letterboxed) ── */
const stage = document.getElementById('stage');
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `scale(${s}) translate(-50%,-50%)`;
}
addEventListener('resize', fit); fit();
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F'){
    document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{});
  }
});

/* ── numbers ── */
const fmt = n => Math.round(n).toLocaleString('en-US');
function setNum(el, v, plus){
  const s = fmt(v);
  if (s === el.dataset.s) return;
  el.dataset.s = s;
  el.textContent = s;
  if (plus > 0){
    const b = document.createElement('b');
    b.className = 'plus';
    b.textContent = '+' + plus;
    b.addEventListener('animationend', () => b.remove());
    el.appendChild(b);
  }
}

/* ── tiles are created once per persona and moved by transform, so reorders animate ── */
const tilesEl = document.getElementById('tiles');
const tileEls = {};
function tileFor(key){
  if (tileEls[key]) return tileEls[key];
  const p = PERSONAS[key], el = document.createElement('div');
  el.className = 'tile';
  el.innerHTML = `<div class="tile-card"><img src="assets/${key}.jpg" alt=""></div>
    <div class="tile-info"><div class="pill tile-rank"><span class="rk"></span><i class="delta"></i></div><div class="tile-th">${p.th}</div><div class="tile-en">${p.en}</div>
    <div class="tile-n"><span class="v">0</span><small>คน</small></div></div>`;
  tilesEl.appendChild(el);
  return tileEls[key] = el;
}

/* ── #1 swaps: the cards themselves fly between the grid and the hero slot ── */
const FLY_MS = 1200, FLY_EASE = 'cubic-bezier(0.22,1,0.36,1)';
const heroCard = document.getElementById('heroCard'), heroImg = document.getElementById('heroImg');
// an element's box in stage pixels (the stage is scaled to the window, so undo that scale)
function stageRect(el){
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), k = s.width / 1920;
  return {left:(r.left - s.left)/k, top:(r.top - s.top)/k, width:r.width/k, height:r.height/k};
}
function fly(key, from, to, r0, r1, onLand){
  const f = document.createElement('div');
  f.className = 'flyer';
  f.innerHTML = `<img src="assets/${key}.jpg" alt="">`;
  stage.appendChild(f);
  const kf = (r, rad) => ({left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px', borderRadius:rad+'px'});
  f.animate([kf(from, r0), kf(to, r1)], {duration:FLY_MS, easing:FLY_EASE, fill:'forwards'})
    .finished.then(() => { onLand(); f.remove(); });
}
function setHero(key){ heroImg.src = `assets/${key}.jpg`; heroImg.alt = PERSONAS[key].en; }
// restartable class flag, e.g. flag(el, 'up', 3000)
function flag(el, cls, ms){
  clearTimeout(el['_' + cls]);
  el.classList.add(cls);
  el['_' + cls] = setTimeout(() => el.classList.remove(cls), ms);
}

/* ── live counts ──
   New data doesn't move every number at once: each persona steps up by its full increase at a
   random moment within the update interval, and at most once every STEP_GAP, so the screen keeps
   changing in a calm, staggered rhythm. Ranks follow the numbers on screen, so a swap happens the
   moment one count visibly passes another. */
const KEYS = Object.keys(PERSONAS);
const FEED_MS = 3000; // how often new (simulated) counts arrive
const SPAN = FEED_MS * 0.9, STEP_GAP = 10000;
let shown = null, target = {}, nextStep = {}, lastStep = {};

function render(data){
  const counts = data.counts || {}, now = performance.now();
  if (!shown){ // first data: show it as-is
    shown = Object.fromEntries(KEYS.map(k => [k, +counts[k] || 0]));
    target = {...shown};
    layout({});
  } else {
    let dropped = false;
    KEYS.forEach(k => {
      target[k] = +counts[k] || 0;
      // a drop (the simulation restarting): jump straight there, no ticking down
      if (target[k] < shown[k]){ shown[k] = target[k]; nextStep[k] = null; dropped = true; }
      // schedule one step unless one is already waiting (it will carry the whole pending amount)
      if (target[k] > shown[k] && nextStep[k] == null)
        nextStep[k] = Math.max(now + Math.random() * SPAN, (lastStep[k] ?? -Infinity) + STEP_GAP);
    });
    if (dropped) layout({});
  }
}

setInterval(() => {
  if (!shown) return;
  const now = performance.now(), bumped = {};
  KEYS.forEach(k => {
    if (nextStep[k] != null && now >= nextStep[k]){
      nextStep[k] = null;
      if (shown[k] < target[k]){ bumped[k] = target[k] - shown[k]; shown[k] = target[k]; lastStep[k] = now; }
    }
  });
  if (Object.keys(bumped).length) layout(bumped);
}, 100);

let heroKey = null, prevRank = {}, flying = false;
function layout(bumped){
  const ranked = KEYS.map(k => ({k, n:shown[k]}))
    // ties keep their current order, so equal counts don't flicker back and forth
    .sort((a, b) => b.n - a.n || (prevRank[a.k] || 99) - (prevRank[b.k] || 99) || a.k.localeCompare(b.k));
  setNum(document.getElementById('total'), ranked.reduce((s, r) => s + r.n, 0), 0);

  // mid-swap: only the numbers move; the order catches up when the cards land
  if (flying){
    setNum(document.getElementById('heroN'), shown[heroKey], bumped[heroKey] || 0);
    KEYS.forEach(k => { if (k !== heroKey && tileEls[k]) setNum(tileEls[k].querySelector('.v'), shown[k], bumped[k] || 0); });
    return;
  }

  const top = ranked[0];
  // a new #1: capture both card boxes before the grid re-lays out
  const swap = heroKey && top.k !== heroKey && tileEls[top.k]
    ? {up:top.k, down:heroKey, from:stageRect(tileEls[top.k].querySelector('.tile-card')), hero:stageRect(heroCard)}
    : null;
  if (!heroKey) setHero(top.k);
  const sameHero = heroKey === top.k;
  heroKey = top.k;
  setNum(document.getElementById('heroN'), top.n, sameHero ? bumped[top.k] || 0 : 0);

  // the hero persona leaves the grid; ranks 2–12 fill slots 1–11 (slot 12 stays empty)
  const w = (tilesEl.clientWidth - GAP * (COLS - 1)) / COLS;
  const h = (tilesEl.clientHeight - GAP * (ROWS - 1)) / ROWS;
  if (tileEls[top.k]) tileEls[top.k].style.visibility = 'hidden';
  ranked.slice(1).forEach((r, i) => {
    const fresh = !tileEls[r.k], el = tileFor(r.k), col = i % COLS, row = Math.floor(i / COLS), rank = i + 2;
    const jump = fresh || el.style.visibility === 'hidden'; // just came down from #1: place it, don't slide
    el.style.visibility = '';
    el.style.setProperty('--w', w + 'px');
    el.style.setProperty('--h', h + 'px');
    if (jump) el.style.transition = 'none';
    el.style.transform = `translate(${col * (w + GAP)}px,${row * (h + GAP)}px)`;
    if (jump){ el.offsetWidth; el.style.transition = ''; }
    el.querySelector('.rk').textContent = `อันดับ ${rank}`;
    const prev = prevRank[r.k];
    if (prev && rank < prev){ flag(el, 'rise', FLY_MS); flag(el, 'up', 3000); el.classList.remove('down'); }
    if (prev && rank > prev){ flag(el, 'fall', FLY_MS); flag(el, 'down', 3000); el.classList.remove('up'); }
    setNum(el.querySelector('.v'), r.n, bumped[r.k] || 0);
  });
  prevRank = Object.fromEntries(ranked.map((r, i) => [r.k, i + 1]));

  if (swap){
    const down = tileEls[swap.down];
    down.classList.add('hold-card');
    heroImg.style.visibility = 'hidden';
    flying = true;
    fly(swap.up, swap.from, swap.hero, 10, 28, () => { setHero(swap.up); heroImg.style.visibility = ''; });
    fly(swap.down, swap.hero, stageRect(down.querySelector('.tile-card')), 28, 10, () => {
      down.classList.remove('hold-card');
      flying = false;
      layout({}); // apply any overtakes that ticked in during the flight
    });
  }
}

/* ── simulated data ──
   Every FEED_MS some personas gain +1–3 (~1.5 people/s overall); every 20–30s one persona from ranks 3–12 surges 1–3 places,
   and every 60–120s #2 surges past #1, so every animation shows up regularly. Past RESET_TOTAL it
   starts over from SAMPLE, so the screen can run all day without the numbers ballooning. */
const RESET_TOTAL = 2000;
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const now = () => performance.now();
let sim = {...SAMPLE}, nextSurge = now() + rand(20, 30) * 1000, nextCrown = now() + rand(60, 120) * 1000;

function simulate(){
  const c = {...sim};
  KEYS.forEach(k => { if (Math.random() < .2) c[k] += rand(1, 3); });
  const order = KEYS.slice().sort((a, b) => c[b] - c[a]);
  if (now() >= nextCrown){ // #2 takes #1
    c[order[1]] = c[order[0]] + rand(3, 8);
    nextCrown = now() + rand(60, 120) * 1000;
  } else if (now() >= nextSurge){ // someone in ranks 3–12 climbs 1–3 places
    const i = rand(2, KEYS.length - 1), to = Math.max(1, i - rand(1, 3));
    c[order[i]] = Math.max(c[order[i]], c[order[to]] + rand(1, 5));
    nextSurge = now() + rand(20, 30) * 1000;
  }
  sim = Object.values(c).reduce((s, n) => s + n, 0) > RESET_TOTAL ? {...SAMPLE} : c;
  render({counts:sim});
}

render({counts:sim});
setInterval(simulate, FEED_MS);
</script>
</body>
