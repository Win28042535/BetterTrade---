<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persona Ranking — Better Trade 2026</title>
<!--
  Ranking display for the event's big screens — a fixed stage scaled to fit any window, in two sizes:
  16:9 (1920×1080: #1 hero + ranks 2–12 in 3×4) and 4:1 LED (4096×1024: a 2–1–3 podium + ranks 4–12 in 4×3).
  Counts start from the real figures at /api/investor-dna (a Vercel rewrite to investor-dna.efin.finance,
  re-read every minute; SNAPSHOT is the fallback) and each persona then wanders up to ±JITTER around its real
  figure, so the screen keeps moving (see "counts" in the script). ?jitter=0 shows the real figures exactly.
  ?speed=fast → a quicker tempo with regular overtakes, for capturing preview video (hides the size switch).
  F → toggle fullscreen · S → switch screen size · H → hide the size switch · ?screen=16x9 | 4x1
-->
<style>
@font-face{font-family:'FC Minimal';src:url(assets/fc-minimal-100-500.ttf) format('truetype');font-weight:100 500;font-display:swap;}
@font-face{font-family:'FC Minimal';src:url(assets/fc-minimal-600-900.ttf) format('truetype');font-weight:600 900;font-display:swap;}
@font-face{font-family:'Baskervville';src:url(assets/baskervville-400-700.ttf) format('truetype');font-weight:400 700;font-display:swap;}
@font-face{font-family:'Taviraj';src:url(assets/taviraj-medium.ttf) format('truetype');font-weight:100 599;font-display:swap;}
@font-face{font-family:'Taviraj';src:url(assets/taviraj-bold.ttf) format('truetype');font-weight:600 900;font-display:swap;}

/* Tokens start from dna-quiz-flow.html's :root. Colour follows the event: the sky of the
   better-trade-2026.vercel.app hero, and the deeper, iridescent spectrum of the 3D asset elements
   (#00D4FE → #F79319, as on the site's title highlight). */
:root{
  --ink:#111318; --muted:#687078; --white:#fff;
  --line:rgba(17,19,24,0.09); --line-strong:rgba(17,19,24,0.17);
  --font:'FC Minimal','Taviraj',system-ui,'Segoe UI',sans-serif;
  --serif:'Baskervville','Bodoni MT',Georgia,serif;
  --ease:cubic-bezier(0.22,1,0.36,1);
  --base:#c3d9f6;       /* letterbox around the stage */
  --muted-base:#3f5370; /* --muted reads too faint on the sky; used for text that sits directly on it */
  --spectrum:linear-gradient(120deg,#00d4fe,#1f87e6 20%,#113cf3 38%,#722df4 55%,#e63bd8 75%,#f79319);
  --grid-bg:linear-gradient(125deg,#00d4fe 0%,#1f87e6 18%,#113cf3 34%,#722df4 52%,#e63bd8 74%,#f79319 100%);
  --g1:#00d4fe; --g2:#e63bd8; --g3:#1f87e6; --g4:#722df4; --g5:#f79319; /* #1 glow blobs */
  --bloom:#722df4;
  --stage-bg:
    /* the light shaft falling toward the #1 card, and soft cloud banks */
    radial-gradient(300px 1000px at 22% -10%, rgba(255,255,255,0.55), transparent 70%),
    radial-gradient(520px 1100px at 22% -10%, rgba(150,192,251,0.45), transparent 72%),
    radial-gradient(700px 260px at 8% 100%, rgba(255,255,255,0.75), transparent 70%),
    radial-gradient(800px 300px at 70% 104%, rgba(255,255,255,0.65), transparent 70%),
    radial-gradient(600px 220px at 96% 18%, rgba(255,255,255,0.5), transparent 70%),
    linear-gradient(180deg,#a9c9f3 0%,#bcd5f6 38%,#d6e3f7 72%,#eef2f9 100%);
  /* the same sky stretched along the 4:1 wall: the shaft lands on the podium's #1, clouds run the length */
  --stage-bg-wide:
    radial-gradient(360px 1000px at 29.4% -10%, rgba(255,255,255,0.55), transparent 70%),
    radial-gradient(640px 1100px at 29.4% -10%, rgba(150,192,251,0.45), transparent 72%),
    radial-gradient(900px 240px at 4% 102%, rgba(255,255,255,0.75), transparent 70%),
    radial-gradient(1000px 260px at 38% 104%, rgba(255,255,255,0.6), transparent 70%),
    radial-gradient(1100px 280px at 74% 106%, rgba(255,255,255,0.65), transparent 70%),
    radial-gradient(800px 200px at 56% 14%, rgba(255,255,255,0.4), transparent 70%),
    radial-gradient(900px 220px at 97% 16%, rgba(255,255,255,0.5), transparent 70%),
    linear-gradient(180deg,#a9c9f3 0%,#bcd5f6 38%,#d6e3f7 72%,#eef2f9 100%);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--base);}
body{font-family:var(--font);color:var(--ink);}

.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;
  padding:44px 72px 44px;display:grid;grid-template-rows:auto 1fr;gap:32px;background:var(--stage-bg);}
/* 4:1: content is held to a ~3070px block (podium + grid), centred, so the header spans what the eye takes in at
   once rather than the full 16 m wall; the sky runs on past it at both ends */
html.wide .stage{--px:514px;width:4096px;height:1024px;padding:36px var(--px) 40px;gap:28px;background:var(--stage-bg-wide);}

/* ── header ── */
.logo{position:absolute;top:28px;right:var(--px,72px);height:34px;}
.hd{position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:22px 0 24px;}
.hd::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:1px;background:var(--spectrum);} /* DNA rule */
.hd-kicker{font-size:22px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted-base);font-weight:500;}
.hd-title{font-size:76px;font-weight:700;line-height:1.05;margin-top:8px;}
.total{display:flex;align-items:baseline;gap:16px;}
.total-n{font-family:var(--serif);font-weight:600;font-size:80px;line-height:.8;font-variant-numeric:tabular-nums;} /* = tile counts */
.total-l{font-size:32px;font-weight:600;color:var(--muted-base);}

/* ── body ── */
.body{display:grid;grid-template-columns:560px 1fr;gap:40px;min-height:0;}
html.wide .body{grid-template-columns:1380px 1fr;gap:80px;}

/* podium — 16:9 shows only #1 (the hero); 4:1 lines up 2–1–3 on a common floor, #1 tallest and centred.
   The #1 slot keeps the .hero-* look; the glow behind its card is the screen's loudest element */
.podium{position:relative;display:flex;align-items:center;justify-content:center;gap:40px;min-height:0;}
html.wide .podium{gap:120px;}
.pod{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;}
.pod-2,.pod-3{display:none;}
html.wide .pod-2,html.wide .pod-3{display:flex;}
.pod-wrap{position:relative;margin-top:16px;}
.pod-card img{width:100%;height:100%;object-fit:cover;display:block;}
/* #2/#3: a step below #1 — a spectrum-ringed white pill, a white rim, a soft still cyan/violet halo
   and a gentler, slower float (vs #1's filled pill, 6px spectrum rim, drifting rainbow glow, 6px float) */
.pod-2 .pod-wrap::before,.pod-3 .pod-wrap::before{content:"";position:absolute;inset:-28px;border-radius:40px;filter:blur(22px);
  background:
    radial-gradient(closest-side at 28% 34%, color-mix(in srgb,#00d4fe 30%,transparent), transparent),
    radial-gradient(closest-side at 72% 70%, color-mix(in srgb,#722df4 28%,transparent), transparent);}
.pod-2 .pod-card,.pod-3 .pod-card{position:relative;z-index:1;height:400px;aspect-ratio:5/7;border-radius:22px;overflow:hidden;
  box-shadow:0 2px 4px rgba(17,19,24,0.14),0 16px 32px rgba(17,19,24,0.16),0 26px 60px color-mix(in srgb,var(--bloom) 22%,transparent);
  animation:floatSm 8s ease-in-out infinite;}
.pod-3 .pod-card{animation-delay:-4s;}
@keyframes floatSm{50%{transform:translateY(-4px)}}
.pod-2 .pod-card::after,.pod-3 .pod-card::after{content:"";position:absolute;inset:0;border-radius:inherit;border:1px solid rgba(255,255,255,0.75);pointer-events:none;}
.pod-2 .pod-rank,.pod-3 .pod-rank{padding:9px 24px;font-size:26px;color:var(--ink);border:2px solid transparent;
  background:linear-gradient(#fff,#fff) padding-box,var(--spectrum) border-box;box-shadow:0 4px 12px rgba(17,19,24,0.10);}
.pod-n{margin-top:32px;display:flex;align-items:flex-end;justify-content:center;
  font-family:var(--serif);font-weight:600;font-size:104px;line-height:.8;font-variant-numeric:tabular-nums;}
.pod-n .unit{margin-left:12px;font-size:36px;}
.pod-n .pct{font-size:51px;}
.pod-n small{font-family:var(--font);color:var(--muted-base);}
/* tight, saturated glow hugging the card — sits in .hero-wrap right behind it */
.hero-wrap{position:relative;margin-top:16px;}
/* five colour blobs centred on the card's own edges, so half of each spills out as a ~50px halo.
   Each drifts on its own path and period (14–22s, offset starts) so they never move in step and
   the colours keep re-mixing where they overlap; only transform/opacity animate (GPU-cheap). */
.hero-glow{position:absolute;inset:-50px;filter:blur(30px);}
.hero-glow i{position:absolute;left:calc(var(--x) - var(--rx));top:calc(var(--y) - var(--ry));width:calc(var(--rx) * 2);height:calc(var(--ry) * 2);
  background:radial-gradient(closest-side,color-mix(in srgb,var(--c) 32%,transparent),transparent 75%);
  animation:var(--path) var(--d) ease-in-out var(--dl) infinite;will-change:transform,opacity;}
.hero-glow i:nth-child(1){--c:var(--g1);--x:10%;--y:26%;--rx:150px;--ry:260px;--path:driftA;--d:17s;--dl:-3s;}
.hero-glow i:nth-child(2){--c:var(--g2);--x:72%;--y:8%; --rx:180px;--ry:150px;--path:driftB;--d:21s;--dl:-11s;}
.hero-glow i:nth-child(3){--c:var(--g3);--x:90%;--y:52%;--rx:160px;--ry:280px;--path:driftC;--d:15s;--dl:-6s;}
.hero-glow i:nth-child(4){--c:var(--g4);--x:10%;--y:74%;--rx:170px;--ry:280px;--path:driftB;--d:19s;--dl:-14s;}
.hero-glow i:nth-child(5){--c:var(--g5);--x:66%;--y:92%;--rx:220px;--ry:160px;--path:driftA;--d:22s;--dl:-8s;}
@keyframes driftA{
  0%,100%{transform:translate(0,0) scale(1);opacity:.85}
  33%{transform:translate(26px,-24px) scale(1.12);opacity:1}
  66%{transform:translate(-20px,22px) scale(.92);opacity:.7}}
@keyframes driftB{
  0%,100%{transform:translate(0,0) scale(1.05);opacity:.9}
  40%{transform:translate(-30px,18px) scale(.9);opacity:.7}
  75%{transform:translate(18px,30px) scale(1.15);opacity:1}}
@keyframes driftC{
  0%,100%{transform:translate(0,0) scale(.95);opacity:.75}
  30%{transform:translate(-22px,-30px) scale(1.1);opacity:1}
  70%{transform:translate(24px,16px) scale(1);opacity:.8}}
/* rank pill — shared by #1 and the tiles; UI font so the numeral doesn't echo the serif counts */
.pill{display:inline-flex;align-items:center;align-self:center;border-radius:48px;background:rgba(17,19,24,0.07);color:#3a4048;
  font-family:var(--font);font-weight:600;line-height:1;white-space:nowrap;}
/* white on the pale spectrum needs a soft dark shadow to stay legible */
.hero-rank{padding:12px 32px;font-size:32px;background:var(--spectrum);color:#fff;
  text-shadow:0 1px 2px rgba(17,19,24,0.45),0 0 6px rgba(17,19,24,0.25);}
/* lifted card: contact + mid + long drop shadows (plus the violet bloom), a spectrum rim to cut it from
   the glow, and a slow 6px float — the drop shadows loosen and fade as it rises */
.hero-card{position:relative;height:524px;aspect-ratio:5/7;border-radius:28px;overflow:hidden;
  --sh-near:0 2px 4px rgba(17,19,24,0.16);
  --sh-bloom:0 30px 80px color-mix(in srgb,var(--bloom) 32%,transparent);
  box-shadow:var(--sh-near),0 14px 28px rgba(17,19,24,0.16),0 44px 70px -12px rgba(17,19,24,0.27),var(--sh-bloom);
  animation:float 6s ease-in-out infinite;}
/* #1's rim: a 6px DNA spectrum ring (a mask cuts the middle out, leaving only the border) */
.hero-card::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:6px;background:var(--spectrum);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
@keyframes float{
  50%{transform:translateY(-6px);
    box-shadow:var(--sh-near),0 18px 32px rgba(17,19,24,0.13),0 54px 80px -14px rgba(17,19,24,0.22),var(--sh-bloom);}}
html.wide .hero-card{height:520px;}
/* margin clears the glow's ~50px spill below the card */
.hero-n{margin-top:48px;display:flex;align-items:flex-end;justify-content:center;
  font-family:var(--serif);font-weight:600;font-size:172px;line-height:.8;font-variant-numeric:tabular-nums;}
.hero-n .unit{margin-left:16px;font-size:56px;}
.hero-n .pct{font-size:80px;}
html.wide .hero-n{margin-top:44px;font-size:140px;}
html.wide .hero-n .unit{font-size:48px;}
html.wide .hero-n .pct{font-size:66px;}
.hero-n small{font-family:var(--font);color:var(--muted-base);}

/* beside each count: its share of the total stacked over the "คน" unit, same size as the unit; the %
   takes the deep middle of the spectrum (blue → violet → magenta) — the pale ends wash out on white */
.unit{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1;}
.pct{font-family:var(--font);font-weight:600;white-space:nowrap;padding-bottom:.08em;
  background:linear-gradient(90deg,#113cf3,#722df4 55%,#e63bd8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

/* ranks after the podium — 16:9: #2–12 in 3×4 (slot 12 empty); 4:1: #4–12 in 4×3 (last 3 slots empty) */
/* the full-strength DNA spectrum (as on the #1 pill), so the near-opaque white tiles pop off it */
.grid{position:relative;border-radius:28px;padding:12px;min-height:0;background:var(--grid-bg);}
.tiles{position:relative;width:100%;height:100%;}
.tile{position:absolute;left:0;top:0;width:var(--w);height:var(--h);display:flex;gap:18px;align-items:center;padding:6px 16px 6px 6px;
  border-radius:20px;background:rgba(255,255,255,0.98);border:2px solid transparent;box-shadow:0 6px 18px rgba(17,19,24,0.14);
  transition:transform var(--move,1.2s) var(--ease),scale .5s var(--ease),box-shadow .5s;will-change:transform;z-index:1;}
html.fast{--move:.8s;}
/* while overtaking, a rising tile lifts above the ones it passes */
.tile.rise{z-index:5;scale:1.05;box-shadow:0 18px 44px rgba(17,19,24,0.22);}
.tile.fall{z-index:0;}
.tile.hold-card .tile-card{visibility:hidden;} /* its card is mid-flight to/from the hero slot */
.delta{display:none;margin-left:8px;font-size:.9em;font-style:normal;}
.tile.up .delta,.tile.down .delta{display:inline;}
.tile.up .delta{color:#15803d;} .tile.up .delta::after{content:"▲";}
.tile.down .delta{color:var(--muted);} .tile.down .delta::after{content:"▼";}
.flyer{position:absolute;z-index:20;overflow:hidden;box-shadow:0 24px 60px rgba(17,19,24,0.3);pointer-events:none;}
.flyer img{width:100%;height:100%;object-fit:cover;display:block;}
.tile-card{flex:none;height:100%;aspect-ratio:5/7;border-radius:10px;overflow:hidden;box-shadow:0 4px 12px rgba(17,19,24,0.16);}
.tile-card img{width:100%;height:100%;object-fit:cover;display:block;}
.tile-info{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;}
.tile-rank{align-self:flex-start;margin-top:8px;padding:6px 14px;font-size:18px;}
.tile-th{font-size:26px;font-weight:700;line-height:1.15;margin-top:6px;}
.tile-en{font-family:var(--serif);font-size:20px;color:var(--muted);margin-top:2px;}
.tile-n{margin-top:auto;display:flex;align-items:flex-end;font-family:var(--serif);font-weight:600;font-size:64px;line-height:.8;font-variant-numeric:tabular-nums;}
.tile-n .unit{margin-left:10px;font-size:32px;}
.tile-n .pct{font-size:44px;line-height:.9;padding-bottom:0;} /* tight stack: % + คน must fit the tile's height */
.tile-n small{line-height:.9;}
.tile-n small{font-family:var(--font);color:var(--muted);}
/* 4:1 tiles are ~550×240: everything a step larger */
html.wide .tile-rank{font-size:22px;padding:8px 16px;}
html.wide .tile-th{font-size:32px;}
html.wide .tile-en{font-size:24px;}
html.wide .tile-n{font-size:80px;}
html.wide .tile-n .unit{font-size:36px;}
html.wide .tile-n .pct{font-size:51px;}

.foot{position:absolute;right:var(--px,72px);bottom:12px;font-size:18px;color:var(--muted-base);letter-spacing:.04em;}
.foot b{display:inline-block;width:8px;height:8px;border-radius:50%;background:#15803d;margin-right:8px;vertical-align:middle;animation:pulse 2s infinite;}
@keyframes pulse{50%{opacity:.3}}

/* ── floating 3D assets ──
   As in the event site's hero: each object sits at its own tilt and bobs/swings slowly on its own
   period, out of step with the others. They only use empty space: the 12th grid slot, the #1 card's
   corners (heart behind, candles in front) and the gap in the header. */
.fl{position:absolute;pointer-events:none;height:var(--h);
  filter:saturate(1.3) drop-shadow(0 16px 18px rgba(17,19,24,0.18));
  animation:bob var(--dur) ease-in-out var(--delay) infinite alternate;will-change:transform;}
@keyframes bob{
  from{transform:translate3d(0,0,0) rotate(var(--rot))}
  to{transform:translate3d(0,var(--drift),0) rotate(calc(var(--rot) + var(--swing)))}}
.fl-heart{--h:176px;--rot:14deg; --swing:-4deg;--drift:-14px;--dur:7s;  --delay:-2s;  right:-90px;top:-78px;}
.fl-stock{--h:210px;--rot:-12deg;--swing:5deg; --drift:-12px;--dur:6s;  --delay:-4s;  left:-112px;bottom:24px;}
.fl-efin {--h:120px;--rot:-18deg;--swing:6deg; --drift:-14px;--dur:8s;  --delay:-1s;  left:59%;top:6px;}
/* the 12th grid slot, sized with the same 3×4 / 12px-gap maths as the tiles */
.slot12{position:absolute;pointer-events:none;
  left:calc((100% - 24px) / 3 * 2 + 24px);top:calc((100% - 36px) / 4 * 3 + 36px);
  width:calc((100% - 24px) / 3);height:calc((100% - 36px) / 4);}
/* 4:1: the 3×3 grid is full, so gold and coin break its frame instead — gold half out past the right
   edge into the sky margin, the coin straddling the bottom edge */
html.wide .slot12{left:0;top:0;width:100%;height:100%;}
html.wide .fl-gold{right:-240px;top:28%;} /* fully in the sky margin, clear of the gradient panel */
html.wide .fl-bitcoin{left:auto;right:36%;top:auto;bottom:-66px;--h:110px;}
html.wide .fl-efin{left:62.4%;top:2px;--h:130px;} /* over the seam between #4 and #5 */
/* 4:1: #2/#3 flank #1 at mid-height, so heart and candles float in the open air outside them */
html.wide .fl-heart{right:auto;left:820px;top:110px;--h:150px;}
html.wide .fl-stock{left:-700px;bottom:auto;top:190px;--h:260px;}
/* 4:1 depth: near pieces are big, crisp, deeply shadowed and slow; far ones small, a touch soft and pale */
html.wide .fl-stock,html.wide .fl-gold{filter:saturate(1.35) drop-shadow(0 26px 24px rgba(17,19,24,0.24));--dur:9s;}
html.wide .fl-diamond{filter:saturate(1.1) blur(1.2px) drop-shadow(0 8px 8px rgba(17,19,24,0.10));opacity:.85;}
.fl-diamond{display:none;--h:80px;--rot:-10deg;--swing:-6deg;--drift:-8px;--dur:9.5s;--delay:-6s;}
html.wide .fl-diamond{display:block;left:1110px;top:-180px;} /* the farthest piece: a small diamond high above #3, level with the triangle */
.fl-gold   {--h:250px;--rot:16deg; --swing:-5deg;--drift:-14px;--dur:9s;  --delay:-5s;  right:6px;top:-40px;}
/* straddles the grid's bottom edge, breaking the frame */
.fl-bitcoin{--h:112px;--rot:-14deg;--swing:6deg; --drift:-12px;--dur:6.5s;--delay:-3s;  left:40px;top:142px;}

/* screen-size switch — fixed to the window, outside the stage (S switches, H hides) */
.screen{position:fixed;left:16px;bottom:16px;z-index:50;display:flex;align-items:center;gap:4px;padding:4px 4px 4px 14px;
  border-radius:48px;background:rgba(255,255,255,0.9);box-shadow:0 4px 14px rgba(17,19,24,0.14);font:600 14px var(--font);color:var(--muted);}
.screen.hide{display:none;}
.screen span{margin-right:6px;}
.screen button{font:inherit;border:0;border-radius:48px;padding:6px 14px;background:transparent;color:var(--muted);cursor:pointer;}
.screen button[aria-pressed="true"]{background:var(--ink);color:#fff;}

@media (prefers-reduced-motion:reduce){.tile{transition:none}.foot b,.hero-glow i,.pod-card,.fl{animation:none}}
</style>
</head>
<body>
<div class="stage" id="stage">
  <img class="logo" src="LOGO/LOGO-efin-Better Trade/LOGO-efin-Better Trade.png" alt="efin × Better Trade">
  <header class="hd">
    <div>
      <div class="hd-kicker">BetterTrade 2026 × New World New Playbook · Investor DNA</div>
      <h1 class="hd-title">ตัวตนนักลงทุน</h1>
    </div>
    <div class="total"><div class="total-l">ผู้ที่ค้นพบตัวตนทั้งหมด (คน)</div><div class="total-n" id="total">0</div></div>
    <img class="fl fl-efin" src="assets/float/efin.webp" alt="">
  </header>

  <main class="body">
    <section class="podium">
      <img class="fl fl-diamond" src="assets/float/diamond.webp" alt="">
      <div class="pod pod-2"><div class="pill pod-rank">อันดับ 2</div>
        <div class="pod-wrap"><div class="pod-card"><img alt=""></div></div>
        <div class="pod-n"><span class="v">0</span><span class="unit"><b class="pct"></b><small>คน</small></span></div></div>
      <div class="pod pod-1"><div class="pill pod-rank hero-rank">อันดับ 1</div>
        <div class="pod-wrap hero-wrap"><div class="hero-glow"><i></i><i></i><i></i><i></i><i></i></div><img class="fl fl-heart" src="assets/float/heart.webp" alt=""><div class="pod-card hero-card"><img alt=""></div><img class="fl fl-stock" src="assets/float/stock.webp" alt=""></div>
        <div class="pod-n hero-n"><span class="v">0</span><span class="unit"><b class="pct"></b><small>คน</small></span></div></div>
      <div class="pod pod-3"><div class="pill pod-rank">อันดับ 3</div>
        <div class="pod-wrap"><div class="pod-card"><img alt=""></div></div>
        <div class="pod-n"><span class="v">0</span><span class="unit"><b class="pct"></b><small>คน</small></span></div></div>
    </section>

    <section class="grid"><div class="tiles" id="tiles">
      <div class="slot12"><img class="fl fl-gold" src="assets/float/gold.webp" alt=""><img class="fl fl-bitcoin" src="assets/float/bitcoin.webp" alt=""></div>
    </div></section>
  </main>
  <div class="foot"><b></b>ข้อมูลสด</div></div>
<div class="screen" id="screen" aria-label="ขนาดจอ"><span>จอ</span><button type="button" data-s="std">16:9</button><button type="button" data-s="wide">4:1</button></div>

<script>
const PERSONAS = {
  guardian:{en:'The Guardian',th:'นักลงทุนสายรักษาทุน'},
  harvester:{en:'The Harvester',th:'นักลงทุนสายเก็บเกี่ยว'},
  steadyhand:{en:'The Steady Hand',th:'นักลงทุนสายสม่ำเสมอ'},
  diamondhand:{en:'The Diamond Hand',th:'นักลงทุนสายถือยาว'},
  analyst:{en:'The Analyst',th:'นักลงทุนสายหาข้อมูล'},
  planner:{en:'The Planner',th:'นักลงทุนสายวางแผน'},
  explorer:{en:'The Explorer',th:'นักลงทุนสายสำรวจ'},
  sage:{en:'The Sage',th:'นักลงทุนสายสมดุลชีวิต'},
  maverick:{en:'The Maverick',th:'นักลงทุนสายบุกเบิก'},
  waverider:{en:'The Wave Rider',th:'นักลงทุนสายโต้คลื่น'},
  contrarian:{en:'The Contrarian',th:'นักลงทุนสายสวนกระแส'},
  collector:{en:'The Collector',th:'นักลงทุนสายสะสม'}
};
// the last real figures known at build time: used until /api/investor-dna answers, or if it can't be reached
const SNAPSHOT = {steadyhand:126,diamondhand:86,analyst:66,harvester:55,explorer:48,contrarian:39,
  waverider:35,planner:30,maverick:18,sage:16,collector:11,guardian:11};
// the two screens: stage size, ranks-grid shape, and how many ranks stand on the podium
const SCREENS = {
  std: {w:1920, h:1080, cols:3, rows:4, pod:1},  // 16:9
  wide:{w:4096, h:1024, cols:3, rows:3, pod:3},  // 4:1 LED wall
};
const GAP = 12;
let mode = new URLSearchParams(location.search).get('screen') === '4x1' ? 'wide' : 'std';
const FAST = new URLSearchParams(location.search).get('speed') === 'fast';
document.documentElement.classList.toggle('fast', FAST);

/* ── fit the stage into any window (letterboxed) ── */
const stage = document.getElementById('stage');
function fit(){
  const {w, h} = SCREENS[mode];
  const s = Math.min(innerWidth / w, innerHeight / h);
  stage.style.transform = `scale(${s}) translate(-50%,-50%)`;
}
addEventListener('resize', fit);

/* ── screen-size switch: ?screen=16x9|4x1 (default 16:9); the URL follows so a link opens on that size ── */
const screenSw = document.getElementById('screen');
if (FAST) screenSw.classList.add('hide');
function setScreen(m){
  mode = m;
  document.documentElement.classList.toggle('wide', m === 'wide');
  screenSw.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.s === m));
  const u = new URL(location.href);
  u.searchParams.set('screen', m === 'wide' ? '4x1' : '16x9');
  history.replaceState(null, '', u);
  fit();
  if (shown) layout({instant:true}); // re-seat everything for the new shape, no flights
}
screenSw.addEventListener('click', e => { if (e.target.dataset.s) setScreen(e.target.dataset.s); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(()=>{});
  if (k === 's') setScreen(mode === 'wide' ? 'std' : 'wide');
  if (k === 'h') screenSw.classList.toggle('hide');
});

/* ── numbers: a count and, beside it, its share of the total ── */
const fmt = n => Math.round(n).toLocaleString('en-US');
function setText(el, s){ if (el.textContent !== s) el.textContent = s; }
function setCount(box, n, total){ // box holds .v (the count) and .pct
  setText(box.querySelector('.v'), fmt(n));
  setText(box.querySelector('.pct'), (total ? n / total * 100 : 0).toFixed(1) + '%');
}

/* ── tiles are created once per persona and moved by transform, so reorders animate ── */
const tilesEl = document.getElementById('tiles');
const tileEls = {};
function tileFor(key){
  if (tileEls[key]) return tileEls[key];
  const p = PERSONAS[key], el = document.createElement('div');
  el.className = 'tile';
  el.innerHTML = `<div class="tile-card"><img src="assets/${key}.jpg" alt=""></div>
    <div class="tile-info"><div class="pill tile-rank"><span class="rk"></span><i class="delta"></i></div><div class="tile-th">${p.th}</div><div class="tile-en">${p.en}</div>
    <div class="tile-n"><span class="v">0</span><span class="unit"><b class="pct"></b><small>คน</small></span></div></div>`;
  tilesEl.appendChild(el);
  return tileEls[key] = el;
}

/* ── podium swaps: the cards themselves fly between podium slots and the grid ── */
const FLY_MS = FAST ? 800 : 1200, FLY_EASE = 'cubic-bezier(0.22,1,0.36,1)';
// podium slots in rank order (#1, #2, #3); only the first SCREENS[mode].pod are in use
const pods = [1, 2, 3].map(n => {
  const el = document.querySelector('.pod-' + n), card = el.querySelector('.pod-card');
  return {card, img:card.querySelector('img'), n:el.querySelector('.pod-n'), radius:n === 1 ? 28 : 22};
});
// an element's box in stage pixels (the stage is scaled to the window, so undo that scale)
function stageRect(el){
  const s = stage.getBoundingClientRect(), r = el.getBoundingClientRect(), k = s.width / stage.offsetWidth;
  return {left:(r.left - s.left)/k, top:(r.top - s.top)/k, width:r.width/k, height:r.height/k};
}
function fly(key, from, to, r0, r1, onLand){
  const f = document.createElement('div');
  f.className = 'flyer';
  f.innerHTML = `<img src="assets/${key}.jpg" alt="">`;
  stage.appendChild(f);
  const kf = (r, rad) => ({left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px', borderRadius:rad+'px'});
  f.animate([kf(from, r0), kf(to, r1)], {duration:FLY_MS, easing:FLY_EASE, fill:'forwards'})
    .finished.then(() => { onLand(); f.remove(); });
}
function setPodImg(i, key){ pods[i].img.src = `assets/${key}.jpg`; pods[i].img.alt = PERSONAS[key].en; pods[i].img.style.visibility = ''; }
// restartable class flag, e.g. flag(el, 'up', 3000)
function flag(el, cls, ms){
  clearTimeout(el['_' + cls]);
  el.classList.add(cls);
  el['_' + cls] = setTimeout(() => el.classList.remove(cls), ms);
}

/* ── live counts ──
   New data doesn't move every number at once: each persona steps up by its full increase at a
   random moment within the update interval, and at most once every STEP_GAP, so the screen keeps
   changing in a calm, staggered rhythm. Ranks follow the numbers on screen, so a swap happens the
   moment one count visibly passes another. */
const KEYS = Object.keys(PERSONAS);
const FEED_MS = FAST ? 800 : 3000; // how often the counts are re-worked (see "counts" below)
const SPAN = FEED_MS * 0.9, STEP_GAP = FAST ? 2000 : 10000;
let shown = null, target = {}, nextStep = {}, lastStep = {};

function render(data){
  const counts = data.counts || {}, now = performance.now();
  if (!shown){ // first data: show it as-is
    shown = Object.fromEntries(KEYS.map(k => [k, +counts[k] || 0]));
    target = {...shown};
    layout();
  } else {
    KEYS.forEach(k => {
      target[k] = +counts[k] || 0;
      // schedule one step unless one is already waiting (it will carry the whole pending amount)
      if (target[k] !== shown[k] && nextStep[k] == null)
        nextStep[k] = Math.max(now + Math.random() * SPAN, (lastStep[k] ?? -Infinity) + STEP_GAP);
    });
  }
}

setInterval(() => {
  if (!shown) return;
  const now = performance.now();
  let stepped = false;
  KEYS.forEach(k => {
    if (nextStep[k] != null && now >= nextStep[k]){
      nextStep[k] = null;
      if (shown[k] !== target[k]){ shown[k] = target[k]; lastStep[k] = now; stepped = true; }
    }
  });
  if (stepped) layout();
}, 100);

let podKeys = [], prevRank = {}, flying = false;
function layout(opts = {}){
  const {cols, rows, pod:P} = SCREENS[mode];
  const ranked = KEYS.map(k => ({k, n:shown[k]}))
    // ties keep their current order, so equal counts don't flicker back and forth
    .sort((a, b) => b.n - a.n || (prevRank[a.k] || 99) - (prevRank[b.k] || 99) || a.k.localeCompare(b.k));
  const total = ranked.reduce((s, r) => s + r.n, 0);
  setText(document.getElementById('total'), fmt(total));

  // mid-flight: only the numbers move; the order catches up when the cards land
  if (flying && !opts.instant){
    podKeys.forEach((k, i) => setCount(pods[i].n, shown[k], total));
    KEYS.forEach(k => { if (!podKeys.includes(k) && tileEls[k]) setCount(tileEls[k], shown[k], total); });
    return;
  }

  const newPod = ranked.slice(0, P).map(r => r.k);
  const instant = opts.instant || !podKeys.length;
  // where every card sits right now (a podium slot, or a visible tile), before anything moves
  const from = {};
  if (!instant) KEYS.forEach(k => {
    const i = podKeys.indexOf(k);
    if (i >= 0) from[k] = {pod:i, rect:stageRect(pods[i].card)};
    else if (tileEls[k] && tileEls[k].style.visibility !== 'hidden') from[k] = {pod:-1, rect:stageRect(tileEls[k].querySelector('.tile-card'))};
  });
  // cards whose home changes: into / out of / across the podium
  const movers = KEYS.filter(k => from[k] && newPod.indexOf(k) !== from[k].pod);

  newPod.forEach((k, i) => {
    if (movers.includes(k)) pods[i].img.style.visibility = 'hidden'; // revealed when its card lands
    else if (podKeys[i] !== k || instant) setPodImg(i, k);
    setCount(pods[i].n, shown[k], total);
  });
  podKeys = newPod;

  // the rest fill the grid in rank order; its trailing slots stay empty
  const w = (tilesEl.clientWidth - GAP * (cols - 1)) / cols;
  const h = (tilesEl.clientHeight - GAP * (rows - 1)) / rows;
  newPod.forEach(k => { if (tileEls[k]) tileEls[k].style.visibility = 'hidden'; });
  ranked.slice(P).forEach((r, i) => {
    const fresh = !tileEls[r.k], el = tileFor(r.k), col = i % cols, row = Math.floor(i / cols), rank = i + P + 1;
    // just came down from the podium (or the grid changed shape): place it, don't slide
    const jump = fresh || instant || el.style.visibility === 'hidden';
    el.style.visibility = '';
    el.classList.toggle('hold-card', movers.includes(r.k));
    el.style.setProperty('--w', w + 'px');
    el.style.setProperty('--h', h + 'px');
    if (jump) el.style.transition = 'none';
    el.style.transform = `translate(${col * (w + GAP)}px,${row * (h + GAP)}px)`;
    if (jump){ el.offsetWidth; el.style.transition = ''; }
    el.querySelector('.rk').textContent = `อันดับ ${rank}`;
    const prev = prevRank[r.k];
    if (!instant && prev && rank < prev){ flag(el, 'rise', FLY_MS); flag(el, 'up', 3000); el.classList.remove('down'); }
    if (!instant && prev && rank > prev){ flag(el, 'fall', FLY_MS); flag(el, 'down', 3000); el.classList.remove('up'); }
    setCount(el, r.n, total);
  });
  prevRank = Object.fromEntries(ranked.map((r, i) => [r.k, i + 1]));

  if (!movers.length) return;
  flying = true;
  let landing = movers.length;
  movers.forEach(k => {
    const to = newPod.indexOf(k);
    const toEl = to >= 0 ? pods[to].card : tileEls[k].querySelector('.tile-card');
    const r0 = from[k].pod >= 0 ? pods[from[k].pod].radius : 10, r1 = to >= 0 ? pods[to].radius : 10;
    fly(k, from[k].rect, stageRect(toEl), r0, r1, () => {
      if (to >= 0){ if (podKeys[to] === k) setPodImg(to, k); }
      else tileEls[k].classList.remove('hold-card');
      if (--landing === 0){ flying = false; layout(); } // apply any overtakes that ticked in during the flights
    });
  });
}

/* ── counts ──
   base = the real figures, re-read every PULL_MS. Each persona carries its own offset, a random walk pulled
   back toward its real figure (so it hovers within about ±10 and the total stays close to the real one),
   capped at ±JITTER and never below zero. In fast mode, overtakes are also staged on a timer: a neighbouring
   pair every 6–10s, #2 past #1 every 25–30s; they use the same ±JITTER room, so one can fall short. */
const API_URL = '/api/investor-dna', PULL_MS = 60000;
const JITTER = Math.max(0, Number(new URLSearchParams(location.search).get('jitter') ?? 50) || 0);
const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
let base = {...SNAPSHOT};
const offset = Object.fromEntries(KEYS.map(k => [k, 0]));

async function pull(){
  try {
    const res = await fetch(API_URL, {cache:'no-store', signal:AbortSignal.timeout(3000)});
    if (!res.ok) throw new Error(res.status);
    const counts = (await res.json()).counts;
    if (KEYS.every(k => Number.isFinite(counts?.[k]))) base = counts;
  } catch (e) { /* keep the last figures we had */ }
}
const liveCounts = () => Object.fromEntries(KEYS.map(k => [k, Math.max(0, base[k] + offset[k])]));

const STEP_CHANCE = FAST ? .5 : .2;
function wander(){
  if (JITTER){
    const c = liveCounts();
    const order = KEYS.slice().sort((x, y) => c[y] - c[x] || (prevRank[x] || 99) - (prevRank[y] || 99));
    order.forEach((k, i) => {
      if (Math.random() >= STEP_CHANCE) return;
      const up = Math.random() < Math.max(.1, Math.min(.9, .55 - offset[k] / 40));
      let by = (up ? 1 : -1) * rand(1, 3);
      // fast mode: random steps never change the order, so ranks only flip on a staged overtake (no flicker)
      if (FAST) by = up ? Math.min(by, i ? c[order[i - 1]] - c[k] : by) : Math.max(by, i < order.length - 1 ? c[order[i + 1]] - c[k] : by);
      c[k] += nudge(k, by);
    });
  }
  if (FAST && JITTER) stageOvertake();
  render({counts:liveCounts()});
}
// move a persona's offset, staying within ±JITTER and above zero; returns how far it really moved
function nudge(k, by){
  const before = offset[k];
  offset[k] = Math.min(JITTER, Math.max(-JITTER, -base[k], before + by));
  return offset[k] - before;
}
let nextPair = performance.now() + rand(6, 10) * 1000, nextCrown = performance.now() + rand(25, 30) * 1000;
function stageOvertake(){
  const t = performance.now(), c = liveCounts(), order = KEYS.slice().sort((x, y) => c[y] - c[x]);
  const pass = (a, b) => { // lift a past b; if a runs out of room, lower b for the rest
    const need = c[b] + rand(1, 4) - c[a];
    if (need > 0) nudge(b, -(need - nudge(a, need)));
  };
  if (t >= nextCrown){ pass(order[1], order[0]); nextCrown = t + rand(25, 30) * 1000; }
  else if (t >= nextPair){ const i = rand(2, KEYS.length - 1); pass(order[i], order[i - 1]); nextPair = t + rand(6, 10) * 1000; }
}

setScreen(mode);
pull().then(() => {
  render({counts:liveCounts()});
  setInterval(wander, FEED_MS);
  setInterval(pull, PULL_MS);
});
</script>
</body>
